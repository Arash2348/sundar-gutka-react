// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
  
    dependencies {
        classpath('com.android.tools.build:gradle:8.6.2')
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("de.undercouch:gradle-download-task:5.0.1")
        classpath('com.google.gms:google-services:4.4.2')
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.3'
        classpath 'com.google.firebase:perf-plugin:1.4.2'
    }
}

apply plugin: "com.facebook.react.rootproject"

// Autopilot: pin ONNX Runtime's native library to the JS package's version (onnxruntime-react-native
// asks for "latest", which changes builds without a code change).
subprojects {
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.microsoft.onnxruntime" && details.requested.name == "onnxruntime-android") {
                details.useVersion "1.24.3"
            }
        }
    }
}
